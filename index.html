<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intranet Zelených – mockup</title>
<style>
:root{
  --g900:#0a3d2a; --g800:#0d4f36; --g700:#0f6b45; --g500:#1fa05a; --g300:#8fd0a8; --g100:#e3f4ea; --g50:#f2faf5;
  --sun:#ffc928; --sun-d:#8a6400; --sun-soft:#fff4cc;
  --bg:#f6f5f0; --card:#fff; --ink:#1b2a22; --ink2:#3d4c43; --mute:#6b7a71; --line:#e4e8e2; --line2:#eef1ec;
  --warn:#c4491c; --warn-soft:#fdebe3; --blue:#2d6aa3; --blue-soft:#e6f0fa;
  --r:14px; --sh:0 1px 2px rgba(10,61,42,.04),0 6px 20px rgba(10,61,42,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--g700);cursor:pointer}
button{font:inherit;cursor:pointer}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:15px;height:15px}.i.lg{width:22px;height:22px}

/* ---------- mockup switch bar ---------- */
.mock{position:sticky;top:0;z-index:40;background:#0c1f16;color:#cfe8d8;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.mock .r1{display:flex;align-items:center;gap:8px;padding:8px 16px;overflow-x:auto}
.mock .brand{display:flex;align-items:center;gap:8px;font-weight:700;color:#fff;white-space:nowrap;margin-right:10px;font-size:13px}
.mock .brand em{font-style:normal;font-weight:600;font-size:10.5px;letter-spacing:.1em;background:var(--sun);color:var(--g900);padding:2px 7px;border-radius:5px}
.mock .role{background:transparent;border:1px solid rgba(255,255,255,.14);color:#cfe8d8;padding:5px 12px;border-radius:99px;font-size:13px;white-space:nowrap}
.mock .role:hover{border-color:rgba(255,255,255,.35)}
.mock .role.on{background:var(--sun);border-color:var(--sun);color:var(--g900);font-weight:650}
.mock .fict{margin-left:auto;font-size:11.5px;color:#7fae94;white-space:nowrap}
.mock .r2{display:none;gap:2px;padding:0 12px;overflow-x:auto;border-top:1px solid rgba(255,255,255,.07)}
.mock .tab{background:none;border:0;color:#9fc4ae;padding:8px 10px;font-size:12.5px;white-space:nowrap;border-bottom:2px solid transparent}
.mock .tab:hover{color:#fff}
.mock .tab.on{color:#fff;border-bottom-color:var(--sun)}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 46px)}
.side{background:var(--g900);color:#cfe8d8;padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:46px;height:calc(100vh - 46px);overflow:auto}
.logo{display:flex;align-items:center;gap:10px;color:#fff;padding:2px 10px 20px}
.logo b{display:block;font-size:16px;line-height:1.1}.logo small{display:block;color:#7fae94;font-size:12px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{display:flex;gap:11px;align-items:center;padding:9px 12px;border-radius:10px;color:#cfe8d8;text-decoration:none;font-size:14px}
.side nav a:hover{background:rgba(255,255,255,.06)}
.side nav a.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.side nav a em{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:700;background:var(--sun);color:var(--g900);border-radius:99px;padding:0 7px;min-width:20px;text-align:center}
.side .sect{margin:16px 12px 6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#6e9a82}
.side .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:14px 10px 4px;border-top:1px solid rgba(255,255,255,.08)}
.side .me b{display:block;color:#fff;font-size:13px}.side .me small{display:block;font-size:11.5px;color:#7fae94;line-height:1.3}
.av{width:34px;height:34px;border-radius:50%;background:var(--g100);color:var(--g700);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.av.sm{width:28px;height:28px;font-size:11px}.av.lg{width:52px;height:52px;font-size:18px}
.av.y{background:var(--sun-soft);color:var(--sun-d)}.av.b{background:var(--blue-soft);color:var(--blue)}
.main{padding:24px 28px 60px;min-width:0}
.main>.in{max-width:1200px;margin:0 auto}

/* ---------- page header ---------- */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph h1{font-size:24px;margin:0;letter-spacing:-.01em}
.ph p{margin:3px 0 0;color:var(--mute);font-size:13.5px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scope{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px 4px 2px 10px;font-size:12.5px;color:var(--mute)}
.scope select{border:0;background:transparent;font:600 13px inherit;color:var(--ink);padding:6px 4px;max-width:280px}

/* ---------- basics ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh)}
.card.flat{box-shadow:none}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .more{margin-left:auto;font-size:12.5px;font-weight:500}
.card .sub{color:var(--mute);font-size:13px;margin:-8px 0 12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g21{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.g12{display:grid;grid-template-columns:1fr 1.6fr;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mt{margin-top:14px}.mt2{margin-top:24px}
.mute{color:var(--mute)}.small{font-size:12.5px}.b{font-weight:650}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.kpis.k5{grid-template-columns:repeat(5,1fr)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi .l{font-size:12.5px;color:var(--mute)}.kpi .v{font-size:25px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.kpi .d{font-size:12px;color:var(--g700);margin-top:2px}.kpi .d.bad{color:var(--warn)}.kpi .d.n{color:var(--mute)}

.btn{display:inline-flex;align-items:center;gap:7px;background:var(--g700);color:#fff;border:1px solid var(--g700);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13.5px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--g800)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--g900)}.btn.sun:hover{background:#f5bb10}
.btn.ghost{background:var(--g100);border-color:var(--g100);color:var(--g700)}.btn.ghost:hover{background:#d4eddf}
.btn.line{background:#fff;border-color:var(--line);color:var(--ink2)}.btn.line:hover{border-color:#cbd3cc}
.btn.danger{background:#fff;border-color:#f0c8b8;color:var(--warn)}.btn.danger:hover{background:var(--warn-soft)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:12px 22px;font-size:15px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.lnk{background:none;border:0;color:var(--g700);font-weight:600;padding:0;font-size:inherit}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--g100);color:var(--g700)}.p-w{background:var(--sun-soft);color:var(--sun-d)}.p-b{background:var(--warn-soft);color:var(--warn)}
.p-n{background:#eef0ed;color:#55625a}.p-bl{background:var(--blue-soft);color:var(--blue)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--g500)}
.dot.w{background:var(--sun)}.dot.b{background:var(--warn)}.dot.n{background:#b9c2bc}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;color:var(--mute);font-weight:500;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t th:first-child,.t td:first-child{padding-left:0}.t th:last-child,.t td:last-child{padding-right:0}
.t tbody tr.click{cursor:pointer}.t tbody tr.click:hover td{background:var(--g50)}
.t .num{text-align:right;font-variant-numeric:tabular-nums}
.t .nm{display:flex;align-items:center;gap:10px}.t .nm small{display:block;color:var(--mute);font-size:12px}
.tblwrap{overflow-x:auto}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 12px;color:var(--mute);font-weight:550;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:13.5px}
.tabs button.on{color:var(--g700);border-bottom-color:var(--g700)}
.tabs button span{font-size:11.5px;background:#eef0ed;border-radius:99px;padding:0 7px;margin-left:5px;color:var(--mute)}
.tabs button.on span{background:var(--g100);color:var(--g700)}

.seg{display:inline-flex;background:#eef0ec;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13px;color:var(--ink2);font-weight:550}
.seg button.on{background:#fff;color:var(--g700);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--ink2);font-weight:600}
.field .hint{font-size:12px;color:var(--mute)}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],select.in,textarea{font:inherit;border:1px solid #d6ddd7;border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink);width:100%}
input:focus,select.in:focus,textarea:focus{outline:2px solid var(--g300);border-color:var(--g500)}
textarea{min-height:120px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;font-size:13.5px;border-bottom:1px solid var(--line2)}
.chk:last-child{border:0}
.chk input{margin-top:3px;accent-color:var(--g700);width:16px;height:16px;flex:none}
.chk small{display:block;color:var(--mute)}
.search{display:flex;align-items:center;gap:8px;border:1px solid #d6ddd7;border-radius:10px;padding:0 10px;background:#fff;min-width:220px}
.search input{border:0;padding:8px 0;outline:0;font:inherit;width:100%}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-size:13px;color:var(--ink2)}
.chip.on{border-color:var(--g500);background:var(--g50);color:var(--g700);font-weight:600}
.tag{display:inline-block;background:#f0f2ef;color:#55625a;border-radius:6px;padding:1px 7px;font-size:11.5px;margin:1px 2px 1px 0}

.note{display:flex;gap:10px;background:var(--g50);border:1px solid #d3ecdc;border-radius:12px;padding:11px 14px;font-size:13px;color:var(--ink2)}
.note.w{background:#fffbea;border-color:#f5e3a3}.note.b{background:var(--warn-soft);border-color:#f3cbb9}.note.bl{background:var(--blue-soft);border-color:#cfe0f2}
.note .i{margin-top:1px;color:var(--g700)}.note.w .i{color:var(--sun-d)}.note.b .i{color:var(--warn)}.note.bl .i{color:var(--blue)}

.todo{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2)}
.todo:last-child{border-bottom:0}
.todo .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--sun-soft);color:var(--sun-d);flex:none}
.todo .ic.g{background:var(--g100);color:var(--g700)}.todo .ic.r{background:var(--warn-soft);color:var(--warn)}.todo .ic.bl{background:var(--blue-soft);color:var(--blue)}
.todo .tx{flex:1;min-width:0}.todo .tx b{display:block;font-size:13.5px;font-weight:600}.todo .tx small{color:var(--mute);font-size:12.5px}
.todo .due{font-size:12px;font-weight:600;white-space:nowrap}

.prog{height:8px;background:var(--g100);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--g500);border-radius:9px}
.prog.y i{background:var(--sun)}.prog.r i{background:var(--warn)}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .st{position:relative;padding:0 0 14px}
.tl .st:before{content:"";position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #c6cfc8}
.tl .st.done:before{background:var(--g500);border-color:var(--g500)}
.tl .st.now:before{background:var(--sun);border-color:var(--sun);box-shadow:0 0 0 4px var(--sun-soft)}
.tl .st.bad:before{background:var(--warn);border-color:var(--warn)}
.tl .st b{display:block;font-size:13.5px}.tl .st small{color:var(--mute);font-size:12.5px}

/* day track for applications */
.track{position:relative;height:46px;margin:8px 4px 4px}
.track .bar{position:absolute;left:0;right:0;top:12px;height:6px;background:var(--line);border-radius:6px}
.track .fill{position:absolute;left:0;top:12px;height:6px;background:var(--g500);border-radius:6px}
.track .mk{position:absolute;top:6px;width:2px;height:18px;background:#b5c0b8}
.track .mk span{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mute);white-space:nowrap}
.track .now{position:absolute;top:4px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--sun);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}

/* stepper */
.stepper{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.stepper div{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mute);font-weight:550}
.stepper div i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#eef0ed;font-style:normal;font-size:11.5px;font-weight:700}
.stepper div.on{color:var(--g700)}.stepper div.on i{background:var(--g700);color:#fff}
.stepper div.done i{background:var(--g100);color:var(--g700)}
.stepper div:not(:last-child):after{content:"";width:22px;height:1px;background:#d4dbd5;margin-left:4px}

/* split list/detail */
.split{display:grid;grid-template-columns:360px 1fr;gap:14px;align-items:start}
.li{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.li:hover{border-color:#c5d3c9}
.li.on{border-color:var(--g500);box-shadow:0 0 0 3px var(--g100)}
.li .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.li small{color:var(--mute);font-size:12.5px}

/* kanban */
.kan{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto}
.col{background:#eef1ec;border-radius:14px;padding:10px;min-height:300px}
.col h4{margin:4px 6px 10px;font-size:13px;display:flex;justify-content:space-between;color:var(--ink2)}
.kc{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.kc b{font-size:13.5px}.kc .meta{font-size:12px;color:var(--mute);margin:3px 0 6px}
.kc .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

/* toggles */
.tg{position:relative;width:38px;height:22px;flex:none;display:inline-block}
.tg input{opacity:0;width:0;height:0}
.tg span{position:absolute;inset:0;background:#cdd5cf;border-radius:22px;transition:.15s}
.tg span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg input:checked+span{background:var(--g500)}
.tg input:checked+span:before{transform:translateX(16px)}
.tg input:disabled+span{opacity:.55}

/* chart */
.chart{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;position:relative}
.chart .c i{display:block;border-radius:4px 4px 0 0;background:var(--g500)}
.chart .c i.r{background:var(--g700);border-radius:0}
.chart .c i.cur{background:var(--sun)}
.chart .c i.f{background:repeating-linear-gradient(45deg,#ffd75e 0 4px,#fff4cc 4px 8px);border:1px dashed #e0b52a;border-bottom:0}
.chart .c i.f+i{border-radius:0}
.chart .c b{font-size:10.5px;font-weight:600;text-align:center;color:var(--ink2);margin-bottom:3px;white-space:nowrap}
.mtrack{position:relative;height:6px;background:var(--line);border-radius:6px;min-width:120px}
.mtrack i{position:absolute;left:0;top:0;bottom:0;background:var(--g500);border-radius:6px}
.mtrack s{position:absolute;top:-3px;width:2px;height:12px;background:#9fb0a5}
.t tfoot td{border-top:1px solid var(--line);border-bottom:0}
.chart .c span{font-size:10.5px;color:var(--mute);text-align:center;margin-top:5px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;font-size:13px;padding:6px 0}
.hbar .prog{height:10px}

/* tree */
.tree .ko{border-bottom:1px solid var(--line2)}
.tree .kh{display:flex;align-items:center;gap:8px;padding:9px 6px;cursor:pointer;font-weight:600;font-size:13.5px;border-radius:8px}
.tree .kh:hover{background:var(--g50)}
.tree .zo{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 30px;cursor:pointer;font-size:13px;border-radius:8px}
.tree .zo:hover{background:var(--g50)}
.tree .on{background:var(--g100)!important;color:var(--g700)}
.tree .cnt{margin-left:auto;font-size:12px;color:var(--mute);font-weight:500}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(12,31,22,.38);z-index:60;display:none}
.ov.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:#fff;z-index:61;box-shadow:-10px 0 40px rgba(0,0,0,.15);overflow:auto;transform:translateX(105%);transition:transform .22s}
.drawer.show{transform:none}
.drawer .dh{position:sticky;top:0;background:#fff;padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;z-index:2}
.drawer .db{padding:18px 22px}
.drawer h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:20px 0 8px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%);width:min(560px,calc(100% - 32px));max-height:88vh;overflow:auto;background:#fff;border-radius:18px;z-index:62;box-shadow:0 20px 60px rgba(0,0,0,.25);display:none;opacity:0;transition:opacity .15s,transform .15s}
.modal.show{display:block;opacity:1;transform:translate(-50%,-50%)}
.modal .mh{padding:18px 22px 4px;display:flex;align-items:center;gap:10px}
.modal .mh h3{margin:0;font-size:17px}
.modal .mb{padding:10px 22px 4px}
.modal .mf{padding:14px 22px 18px;display:flex;gap:8px;justify-content:flex-end}
.x{background:none;border:0;color:var(--mute);margin-left:auto;padding:4px;border-radius:8px}.x:hover{background:#f0f2ef}
.dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13.5px}
.dl dt{color:var(--mute)}.dl dd{margin:0}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--g900);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;z-index:80;opacity:0;transition:.2s;display:flex;gap:9px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .i{color:var(--sun)}

/* email preview */
.mailprev{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}

function flower(sz,c='#FFA6D1',cls='fl'){return `<svg class="${cls}" width="${sz}" height="${sz}" viewBox="0 0 100 100" aria-hidden="true"><g fill="${c}" transform="rotate(-8 50 50)">${[0,45,90,135].map(a=>`<rect x="42" y="6" width="16" height="88" rx="4" transform="rotate(${a} 50 50)"/>`).join('')}</g></svg>`}
function qr(seed,size=140){const r=rng(seed),n=25,c=size/n;let s='';
  const finder=(x,y)=>`<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}" fill="#0a3d2a"/><rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" fill="#fff"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" fill="#0a3d2a"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16))continue;if(r()>.52)s+=`<rect x="${x*c}" y="${y*c}" width="${c+.3}" height="${c+.3}" fill="#0a3d2a"/>`}
  return `<span class="qr"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${s}${finder(0,0)}${finder(18,0)}${finder(0,18)}</svg></span>`}
const stepper=(labels,cur)=>`<div class="stepper">${labels.map((l,i)=>`<div class="${i+1===cur?'on':i+1<cur?'done':''}"><i>${i+1<cur?'✓':i+1}</i>${l}</div>`).join('')}</div>`;
const stagePill=s=>({'člen':'<span class="pill p-ok">člen</span>','příznivec':'<span class="pill p-bl">příznivec</span>','dobrovolník':'<span class="pill p-w">dobrovolník</span>','kontakt':'<span class="pill p-n">kontakt</span>'}[s]||s);
const zoOptions=sel=>KO.map(k=>`<optgroup label="KO ${k.n}">${k.z.map(z=>`<option ${z[0]===sel?'selected':''}>${z[0]}</option>`).join('')}</optgroup>`).join('');
const zoKO=zo=>(ALL_ZO.find(z=>z.zo===zo)||{}).ko;

const V={};

/* =====================================================================
   VEŘEJNÁ ČÁST
   ===================================================================== */
const PSC_MAP=[['1',['Praha 7','Praha 3','Praha 6','Praha 10']],['60',['Brno-střed a severovýchod']],['61',['Brno-Žabovřesky','Brno-severozápad']],['62',['Brno-severozápad']],['30',['Plzeň']],['37',['České Budějovice']],['46',['Liberec']],['50',['Hradec Králové']],['70',['Ostrava']],['77',['Olomouc']],['40',['Ústí nad Labem']],['53',['Pardubický kraj']],['58',['Jihlava']],['76',['Zlín']]];
function pscZO(psc){const p=psc.replace(/\s/g,'');for(const [k,v] of PSC_MAP)if(p.startsWith(k))return v[0];return null}

V['pub.join']=()=>{
  const J=S.join, isC=J.type==='clen';
  const labels=isC?['Kontakt','O vás a bydliště','Prohlášení','Příspěvek']:['Kontakt','O vás a bydliště','Odeslání'];
  const last=labels.length, done=J.step>last;
  const sugZO=pscZO(J.psc)||'Brno-střed a severovýchod';
  const zoSel=J.zoMode==='none'?null:J.zoMode==='other'?J.zo:sugZO;
  const kraj=J.elsewhere?J.kraj:zoKO(sugZO);
  const FEES=[[2400,'Doporučený','Pomáhá financovat kampaně a místní projekty.'],[990,'Základní','Nejčastější volba.'],[360,'Minimální','Pro ty, kterým finance nedovolí víc.'],[250,'Čtvrtletní','Jen září až listopad, platí do konce roku.']];
  const prog=`<div class="jprog"><div class="row"><b>${done?'Hotovo':'Krok '+J.step+' ze '+last}</b><span class="sp"></span><span class="small mute">${done?'':labels[J.step-1]}</span></div><div class="prog" style="margin-top:6px"><i style="width:${Math.min(100,J.step/last*100)}%"></i></div></div>`;
  const next=(t='Pokračovat')=>`<div class="row mt2">${J.step>1?`<button class="btn line" onclick="S.join.step--;render()">${ic('back','sm')} Zpět</button>`:''}<span class="sp"></span><button class="btn lg ${J.step===last?'sun':''}" onclick="S.join.step++;render();window.scrollTo({top:0,behavior:'smooth'})">${t} ${ic('arrow','sm')}</button></div>`;
  const yn=(k)=>`<div class="seg"><button class="${J[k]==='ne'?'on':''}" onclick="S.join.${k}='ne';render()">Ne</button><button class="${J[k]==='ano'?'on':''}" onclick="S.join.${k}='ano';render()">Ano</button></div>`;
  let body='';
  if(J.step===1) body=`<div class="jtabs" role="tablist">${[['clen','Člen','star'],['priznivec','Příznivec','sprout'],['dobro','Dobrovolník','hand']].map(([k,l,i])=>`<button role="tab" class="${(k==='clen'&&isC)||(k==='priznivec'&&!isC)?'on':''}" onclick="${k==='dobro'?"go('pub','help')":`S.join.type='${k}';render()`}">${ic(i,'sm')} ${l}</button>`).join('')}</div>
    <p class="jtabd">${isC?'<b>Členství:</b> hlasujete o kandidátkách a programu, můžete kandidovat. Roční příspěvek od 360 Kč, přijetí do měsíce.':'<b>Registrovaný příznivec:</b> bez členských závazků a bez povinného příspěvku. Novinky a pozvánky na akce z vašeho okolí, členem se můžete stát kdykoli později.'}</p>
    <h2 class="jh">${isC?'Přihláška do Strany zelených':'Registrace příznivce'}</h2>
    <div class="frow"><div class="field"><label>Jméno</label><input type="text" autocomplete="given-name" value="Marek"></div><div class="field"><label>Příjmení</label><input type="text" autocomplete="family-name" value="Dvořák"></div></div>
    <div class="field"><label>E-mail</label><input type="email" autocomplete="email" value="marek.dvorak@priklad.cz"></div>
    <div class="field"><label>Telefon</label><input type="tel" autocomplete="tel" value="+420 731 482 019"></div>
    <button class="btn sun lg" style="width:100%;justify-content:center;margin-top:4px" onclick="S.join.step=2;render();window.scrollTo({top:0,behavior:'smooth'})">Pokračovat ${ic('arrow','sm')}</button>
    `;
  if(J.step===2) body=`<h2 class="jh">O vás a bydliště</h2>
    <div class="frow"><div class="field"><label>Datum narození</label><input type="text" autocomplete="bday" value="12. 4. 1991"><span class="hint ok">${ic('check','sm')} ${isC?'Splňujete věk pro členství (18+)':'Děkujeme'}</span></div>
      <div class="field"><label>Jak se identifikujete?</label><div class="seg" style="align-self:flex-start">${['Žena','Muž','Non-binary'].map(g=>`<button class="${J.gender===g?'on':''}" onclick="S.join.gender='${g}';render()">${g}</button>`).join('')}</div></div></div>
    ${isC?`<div class="note bl" style="margin:-2px 0 14px">${ic('shield')}<div>Podle zákona se členem strany může stát jen občan ČR starší 18 let.</div></div>`:''}
    <h3 class="jsub">Trvalý pobyt</h3>
    <div class="frow3" style="grid-template-columns:1fr 2fr"><div class="field"><label>PSČ</label><input type="text" autocomplete="postal-code" value="${J.psc}" onchange="S.join.psc=this.value;S.join.zoMode='sug';render()"></div><div class="field"><label>Město</label><input type="text" autocomplete="address-level2" value="Brno"></div></div>
    <div class="field"><label>Ulice a č. p.</label><input type="text" autocomplete="street-address" value="Údolní 28"></div>
    <label class="chk" style="border:0;padding-top:0"><input type="checkbox" ${J.elsewhere?'checked':''} onchange="S.join.elsewhere=this.checked;render()"><span><b>Ve skutečnosti žiju jinde</b><small>Podle toho vám nabídneme nejbližší místní organizaci.</small></span></label>
    ${J.elsewhere?`<div class="jbox"><div class="frow"><div class="field"><label>Stát</label><select class="in"><option>Česká republika</option><option>jiný stát</option></select></div><div class="field"><label>Kraj</label><select class="in" onchange="S.join.kraj=this.value;render()">${KO.map(k=>`<option ${k.n===J.kraj?'selected':''}>${k.n}</option>`).join('')}<option>mimo ČR</option></select></div></div>
      <div class="field" style="margin:0"><label>Obec <span class="mute" style="font-weight:400">(v Praze a Brně i městská část)</span></label><input type="text" value="Praha 7 – Holešovice"></div></div>`:''}
    <h3 class="jsub">Místní organizace <span class="pill p-n" style="vertical-align:2px">nepovinné</span></h3>
    <p class="small mute" style="margin:-4px 0 10px">Členem můžete být i bez místní organizace. Pozveme vás ale na setkání té nejbližší, účast je dobrovolná.</p>
    <div class="stack" style="gap:8px">
      <button class="choice sm ${J.zoMode==='sug'?'on':''}" onclick="S.join.zoMode='sug';render()"><span class="radio"></span><div><b>ZO ${sugZO}</b><small>nejblíž vašemu bydlišti · KO ${zoKO(sugZO)} · ${(ALL_ZO.find(z=>z.zo===sugZO)||{}).m} členů</small></div></button>
      <button class="choice sm ${J.zoMode==='other'?'on':''}" onclick="S.join.zoMode='other';render()"><span class="radio"></span><div><b>Jiná organizace</b><small>třeba podle místa práce nebo studia</small>${J.zoMode==='other'?`<select class="in mt" onclick="event.stopPropagation()" onchange="S.join.zo=this.value;render()">${zoOptions(J.zo)}</select>`:''}</div></button>
      <button class="choice sm ${J.zoMode==='none'?'on':''}" onclick="S.join.zoMode='none';render()"><span class="radio"></span><div><b>Zatím bez místní organizace</b><small>Budete členem KO ${kraj}. Připojit se můžete kdykoli později.</small></div></button></div>
    ${next()}`;
  if(isC&&J.step===3) body=`<h2 class="jh">Něco více o vás <span class="pill p-n" style="vertical-align:3px;font-size:12px">nepovinné</span></h2>
    <div class="field"><label>Profese, zájmy a aktivity</label><textarea style="min-height:80px" placeholder="Čím se živíte, čemu se věnujete, v čem jste odborník/ice, kde se angažujete (spolky, komunitní projekty)…">Pracuji jako dopravní inženýr. Ve volném čase jezdím na kole a pomáhám v sousedském spolku na Veveří.</textarea><span class="hint">Pomůže nám nabídnout vám odbornou sekci nebo projekt, který vás bude bavit.</span></div>
    <div class="field"><label>Proč chcete vstoupit k Zeleným?</label><textarea style="min-height:80px" placeholder="Co vás přivedlo, co chcete změnit, už jste byli v kontaktu s místní organizací?">Chci, aby Brno bylo město pro lidi, ne pro auta. S místní organizací jsem byl na jedné akci a líbilo se mi tam.</textarea><span class="hint">Přečte si to vaše místní organizace. Na posouzení přihlášky to vliv nemá.</span></div>
<h3 class="jsub" style="margin-top:24px">Prohlášení</h3><p class="mute small" style="margin:-4px 0 12px">Ptáme se na totéž jako každého uchazeče. Upřímná odpověď pomůže, každou situaci posuzujeme jednotlivě.</p>
    <div class="qcard"><div class="row"><b class="sp">Byl/a jste už někdy členem Zelených, žádal/a o členství nebo byl/a vyloučen/a?</b>${yn('q1')}</div>${J.q1==='ano'?`<textarea class="mt" style="min-height:60px" placeholder="Kdy a jak to proběhlo?"></textarea>`:''}</div>
    <div class="qcard"><div class="row"><b class="sp">Jste nebo jste byl/a členem jiné politické strany či hnutí, i zahraničního?</b>${yn('q2')}</div>${J.q2==='ano'?`<textarea class="mt" style="min-height:60px" placeholder="Které strany nebo hnutí, kdy a zda jste zastával/a funkci"></textarea><p class="small" style="color:var(--sun-d);margin:6px 0 0">${ic('alert','sm')} Členem nesmíte být současně. Pokud v jiné straně stále jste, je potřeba nejdřív ukončit tamní členství.</p>`:''}</div>
    <div class="qcard"><div class="row"><b class="sp">Byl/a jste někdy odsouzen/a nebo je proti vám vedeno trestní stíhání?</b>${yn('q3')}</div>${J.q3==='ano'?`<textarea class="mt" style="min-height:60px" placeholder="Stručně popište"></textarea>`:''}</div>
    ${next()}`;
  if(J.step===last&&!(isC&&J.step!==4)){
    body=`<h2 class="jh">${isC?'Členský příspěvek':'Odeslání'}</h2>
    ${isC?`<p class="mute" style="margin:-6px 0 14px">Zaplacený příspěvek je podmínkou členství. Výši volíte jen na letošek, příští rok si ji vyberete znovu.</p>
    <div class="fees">${FEES.map(([a,l,d])=>`<button class="fee ${J.fee===a?'on':''}" onclick="S.join.fee=${a};render()">${a===2400?'<em>doporučujeme</em>':''}<span class="radio"></span><div><b>${fmt(a)} Kč</b><small>${l} · ${a===250?'čtvrtletně':'ročně'}</small><p>${d}</p></div></button>`).join('')}</div>
    <p class="small mute">Příspěvek zaplacený v prosinci se počítá na další kalendářní rok. Zaplatit můžete hned po odeslání, platební údaje vám pošleme i e-mailem.</p>`:''}
    <div class="jsummary"><div class="small b mute" style="text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Kontrola</div>
      <dl class="dl" style="grid-template-columns:130px 1fr"><dt>Jméno</dt><dd>Marek Dvořák · 12. 4. 1991</dd><dt>Kontakt</dt><dd>marek.dvorak@priklad.cz · +420 731 482 019</dd><dt>Organizace</dt><dd>${zoSel?'ZO '+zoSel:'bez místní organizace · KO '+kraj}</dd>${isC?`<dt>Příspěvek</dt><dd>${kc(J.fee)}</dd>`:''}</dl><button class="lnk small" onclick="S.join.step=2;render()">Upravit</button></div>
    <label class="chk"><input type="checkbox" checked><span>Chci dostávat novinky e-mailem <small>Zhruba dvakrát měsíčně, odhlásit se můžete kdykoli.</small></span></label>
    <label class="chk"><input type="checkbox"><span>Chci pomáhat i jako dobrovolník <small>Ozve se vám koordinátor/ka.</small></span></label>
    <p class="small mute" style="margin-top:14px">Odesláním potvrzujete, že jste se seznámil/a ${isC?'a souhlasíte s <a>programovými cíli</a>, <a>právy a povinnostmi členů</a> a splňujete <a>podmínky členství</a> podle stanov':'s <a>informacemi o zpracování údajů</a>'}. Osobní údaje zpracováváme na základě oprávněného zájmu, podrobnosti na <a>zeleni.cz/soukromi</a>.</p>
    <div class="row mt"><button class="btn line" onclick="S.join.step--;render()">${ic('back','sm')} Zpět</button><span class="sp"></span><button class="btn sun lg" onclick="S.join.step++;render();window.scrollTo({top:0,behavior:'smooth'})">${isC?'Odeslat přihlášku':'Registrovat se'} ${ic('arrow','sm')}</button></div>`;
  }
  if(done){
    body=`<div class="big-ok">${ic('check')}</div><h2 class="jh" style="margin-bottom:4px">${isC?'Přihláška je odeslaná':'Vítejte mezi příznivci!'}</h2><p class="mute" style="margin:0 0 18px">Shrnutí jsme poslali na marek.dvorak@priklad.cz. Číslo přihlášky: <b>P-2026-0418</b>.</p>
    ${isC?(J.paid?`<div class="note" style="margin-bottom:18px">${ic('check')}<div><b>Příspěvek ${kc(J.fee)} je zaplacený.</b> Děkujeme! Teď už jen počkáme, až uplyne lhůta.</div></div>`:
    `<div class="paybox"><div class="row"><div class="sp"><div class="small b" style="color:var(--sun-d);text-transform:uppercase;letter-spacing:.06em">Poslední krok</div><h3 style="margin:2px 0 0;font-size:19px">Zaplaťte členský příspěvek ${kc(J.fee)}</h3></div></div>
      <div class="seg mt"><button class="${J.pay==='qr'?'on':''}" onclick="S.join.pay='qr';render()">QR platba</button><button class="${J.pay==='card'?'on':''}" onclick="S.join.pay='card';render()">Kartou</button></div>
      ${J.pay==='qr'?`<div class="row mt" style="align-items:flex-start;gap:20px">${qr('join'+J.fee,130)}<dl class="dl" style="grid-template-columns:120px 1fr"><dt>Částka</dt><dd><b>${kc(J.fee)}</b></dd><dt>Účet</dt><dd>1234567890/2010 <span class="small mute">(fiktivní)</span></dd><dt>Variabilní symbol</dt><dd><b>52 418</b></dd><dt>Zpráva</dt><dd>Příspěvek Marek Dvořák</dd></dl></div><button class="btn mt" onclick="S.join.paid=true;render()">Zaplatil/a jsem</button>`:
      `<div class="mt" style="max-width:420px"><div class="cardfield">${ic('card','sm')} 4242 4242 4242 4242 · 12/28 · 123</div><label class="chk"><input type="checkbox"><span>Platit příspěvek automaticky každý rok<small>Kdykoli zrušíte v profilu.</small></span></label><button class="btn sun" onclick="S.join.paid=true;render()">Zaplatit ${kc(J.fee)}</button><p class="small mute">${ic('lock','sm')} Zabezpečeno přes Stripe.</p></div>`}
      <p class="small mute" style="margin-bottom:0">Nechcete teď? Platební údaje máte v e-mailu. Připomeneme se, pokud platba nepřijde.</p></div>`):''}
    <h3 class="jsub">Co bude dál</h3><div class="tl">
      ${isC?`<div class="st done"><b>Dnes: přihláška přijata</b><small>Vedení ${zoSel?'ZO '+zoSel:'KO '+kraj} o vás ví.</small></div>
      <div class="st ${J.paid?'done':'now'}"><b>${J.paid?'Příspěvek zaplacen':'Zaplatíte příspěvek'}</b><small>${J.paid?'Spárujeme ho automaticky.':'Bez něj vás nemůžeme přijmout.'}</small></div>
      <div class="st"><b>${zoSel?'Pozvánka na setkání ZO '+zoSel:'Nabídka místní organizace'}</b><small>${zoSel?'Účast je dobrovolná. Je to nejlepší způsob, jak poznat lidi.':'Připojit se můžete kdykoli v profilu.'}</small></div>
      <div class="st"><b>Do měsíce: jste členem</b><small>Pokud nikdo nevznese námitku podle stanov. Kdyby ano, dáme vám vědět.</small></div>
      <div class="st"><b>Hned potom: přístupy</b><small>Účet Zelených, fórum a rozesílače se založí automaticky.</small></div>`:
      `<div class="st done"><b>Dnes: registrace přijata</b><small>${zoSel?'ZO '+zoSel+' o vás ví.':'Jste zaregistrováni u KO '+kraj+'.'}</small></div><div class="st"><b>Do 7 dní: uvítání</b><small>Pozvánka na nejbližší akci.</small></div><div class="st"><b>Za rok: potvrzení zájmu</b><small>Jedním kliknutím.</small></div>`}</div>
    <div class="row mt2"><button class="btn line" onclick="S.join={...S.join,step:1,paid:false};render()">${ic('refresh','sm')} Projít flow znovu</button></div>`;
  }
  const aside=`<aside class="jaside"><div class="card"><h3>${ic('file')} Vaše ${isC?'přihláška':'registrace'}</h3>
      <dl class="dl" style="grid-template-columns:90px 1fr;font-size:13px"><dt>Jméno</dt><dd>Marek Dvořák</dd><dt>Organizace</dt><dd>${J.step>=2?(zoSel?'ZO '+zoSel:'bez ZO · KO '+kraj):'<span class="mute">—</span>'}</dd>${isC?`<dt>Příspěvek</dt><dd>${J.step>=last?kc(J.fee):'<span class="mute">—</span>'}</dd>`:''}</dl></div>
    <div class="card"><h3>${ic('shield')} Kdo uvidí vaše údaje</h3><p class="small" style="margin:0">Jen vaše místní a krajská organizace a hlavní kancelář. Každé zobrazení se zapisuje.</p></div>
    <div class="card"><h3>${ic('msg')} Nevíte si rady?</h3><p class="small" style="margin:0">Napište nám, ozve se vám člověk z hlavní kanceláře, obvykle do druhého dne.</p></div></aside>`;

  if(J.step>1) return `<div class="jtop"><div class="pw"><button class="lnk" style="color:#fff;opacity:.85" onclick="S.join.step=1;render()">${ic('back','sm')} Přidejte se k Zeleným</button></div></div>
    <div class="pw jwrap"><div class="pubcard">${prog}${body}</div>${done?'':aside}</div>`;

  return `<section class="lhero"><div class="pw lgrid">
    <div><div class="eyebrow">Staňte se členy Zelených</div>
      <h1>Přidejte se k Zeleným</h1>
      <p class="lead">Změna začíná s vámi. Spravedlivější a zelenější společnost nevznikne sama, ale díky lidem, kteří se zapojí.</p>
      <ul class="why">${[['users','Potkáte lidi, kteří to myslí podobně'],['sprout','Zapojíte se do kampaní a projektů ve svém okolí'],['star','Naučíte se nové věci na školeních a akcích'],['spark','Uplatníte svou odbornost v odborných sekcích']].map(([i,t])=>`<li>${ic(i)}<span>${t}</span></li>`).join('')}</ul>
</div>
    <div class="lform" id="prihlaska">${prog}${body}</div>
  </div></section>
  <section class="lsteps"><div class="pw"><div class="lkicker">Jak to probíhá</div><h2 class="lh2">Od přihlášky ke členství za měsíc</h2>
    <div class="tl4">${[['file','Vyplníte přihlášku','Kontakt, bydliště a pár otázek.'],['card','Zaplatíte příspěvek','Hned po odeslání, QR kódem nebo kartou. Výši si zvolíte sami.'],['users','Seznámíte se','Pozveme vás na setkání nejbližší organizace. Je to dobrovolné.'],['star','Jste členem','Do měsíce, pokud nikdo nevznese námitku. Pak dostanete přístupy.']].map(([i,t,d],n)=>`<div class="tl4i"><div class="tl4c">${ic(i,'lg')}<em>${n+1}</em></div><b>${t}</b><span>${d}</span></div>`).join('')}</div></div></section>

      ${[['men/32','Tomáš Vaněk','ZO Liberec · odborná sekce Doprava','Bál jsem se, že to bude jen o schůzích. Je to hlavně o lidech, se kterými se dá něco udělat.'],['women/68','Adéla Kříž','ZO České Budějovice · členkou od 2024','Nejdřív jsem pomáhala na stáncích. Členkou jsem se stala, když jsem chtěla i rozhodovat.']].map(([p,n,r,q])=>`<figure class="tcard"><blockquote>„${q}“</blockquote><figcaption>${photo(p,n,'tph')}<div><b>${n}</b><span>${r}</span></div></figcaption></figure>`).join('')}
    </div><p class="small mute" style="text-align:center;margin-top:12px">Jména, citace a fotografie jsou v mockupu ilustrační.</p></section>

  <section class="lfaqw"><div class="pw lfaq"><div><div class="lkicker">Časté otázky</div><h2 class="lh2">Na co se lidé ptají</h2>
      <div class="lhelp"><div class="av y lg">${ic('msg','lg')}</div><div><b>Nenašli jste odpověď?</b><p>Napište nám. Ozve se vám člověk z hlavní kanceláře, obvykle do druhého dne.</p><button class="btn ghost sm" onclick="toast('Otevřen kontaktní formulář')">Zeptat se</button></div></div></div>
    <div>${[['Kdo se může stát členem?','Občan ČR starší 18 let, který není členem jiné politické strany ani hnutí.'],['Musím být v místní organizaci?','Nemusíte. Členem můžete být i bez ní, pak patříte pod krajskou organizaci. Na setkání vás pozveme, ale účast je dobrovolná.'],['Kolik je příspěvek?','Doporučený 2 400 Kč, základní 990 Kč a minimální 360 Kč ročně. Od září do listopadu lze zaplatit i čtvrtletní 250 Kč. Výši si volíte každý rok znovu.'],['Proč přijetí trvá měsíc?','Stanovy dávají organizaci měsíc na případnou námitku. Pokud žádná nepřijde a máte zaplaceno, jste členem automaticky.'],['Kolik času to zabere?','Tolik, kolik chcete. Někdo přijde jednou za čas na setkání, jiný vede kampaň. Nic se nevyžaduje.'],['Co se stane s mými údaji?','Uvidí je jen vaše místní a krajská organizace a hlavní kancelář. Zpracováváme je na základě oprávněného zájmu.']].map(([q,a],i)=>`<details class="faq2" ${i===1?'open':''}><summary>${q}<span>${ic('plus','sm')}</span></summary><p>${a}</p></details>`).join('')}</div></div></section>

  <section class="lcta2"><div class="pw"><div class="lcta2in"><div class="lsun">${sun(180)}</div><div><h2>Změna začíná s vámi</h2><p>Přihláška má čtyři krátké kroky.</p></div><button class="btn sun lg" onclick="window.scrollTo({top:0,behavior:'smooth'})">Vyplnit přihlášku ${ic('arrow','sm')}</button></div></div></section>`;
};

V['pub.help']=()=>{
  const H=S.help;
  if(H.done){const c=mkName(rng('coord'+'zo|Brno-střed a severovýchod'),true);const on=H.where==='online',city=H.city||'vašem městě';
    const ev=[['So 22. 11.','Výsadba stromů',city+' · Lužánky',12,7,0],['Út 25. 11.','Roznos letáků',city+' · Veveří',6,2,0],['Čt 4. 12.','Telefonování příznivcům','online · z domova',5,3,1],['Průběžně','Sdílení kampaní na sociálních sítích','online · kdykoli',20,11,1]].filter(e=>H.where==='both'||(on?e[5]:!e[5]||e[1].startsWith('Telefon')));
    return `<div class="pubhero"><div class="pw"><h1>Díky, že chcete pomoct!</h1><p>Do 7 dní se vám ozve koordinátor/ka z vašeho okolí.</p></div></div><div class="pw pubbody"><div class="pubcard">
    <div class="row" style="align-items:flex-start;gap:18px"><div class="av lg y">${ini(c.name)}</div><div class="sp"><div class="small mute">Vaše koordinátorka</div><h2 style="margin:0">${c.name}</h2><p class="mute" style="margin:2px 0 0">${on?'online tým dobrovolníků':'koordinátorka pro '+city+(H.where==='both'?' a online úkoly':'')} · ozve se e-mailem nebo telefonem</p></div></div>
    <h3 class="mt2">Nejbližší akce, kde se hodí pomoc</h3>
    <table class="t"><tbody>
    ${ev.map(([d,n,w,need,have])=>`<tr><td style="width:96px"><b>${d}</b></td><td><b style="font-weight:600">${n}</b><div class="small mute">${ic(w.startsWith('online')?'link':'pin','sm')} ${w} · potřeba ${need} lidí · přihlášeno ${have}</div></td><td class="num"><button class="btn sm ghost" onclick="toast('Přihlášeno. Připomeneme vám to den předem.')">Přijdu</button></td></tr>`).join('')}
    </tbody></table><div class="row mt2"><button class="btn line" onclick="S.help.done=false;render()">${ic('refresh','sm')} Projít flow znovu</button></div></div></div>`}
  return `<div class="pubhero"><div class="pw"><h1>Chci pomoct</h1><p>Nemusíte být členem. Řekněte nám, kde a s čím chcete pomoct a kolik máte času. Ozve se vám koordinátor/ka z vašeho města nebo z online týmu.</p></div></div>
  <div class="pw pubbody"><div class="pubcard"><div class="g21"><div>
    <h3 style="margin-top:0">Vaše údaje</h3>
    <div class="frow"><div class="field"><label>Jméno a příjmení</label><input type="text" autocomplete="name" value="Eva Němcová"></div><div class="field"><label>Telefon</label><input type="tel" autocomplete="tel" value="+420 604 118 552"></div></div>
    <div class="field"><label>E-mail</label><input type="email" autocomplete="email" value="eva.nemcova@priklad.cz"></div>
    <h3 class="mt2">Kde chcete pomáhat?</h3>
    <div class="seg">${[['city','Ve svém městě'],['online','Online, z domova'],['both','Obojí']].map(([k,l])=>`<button class="${H.where===k?'on':''}" onclick="S.help.where='${k}';render()">${l}</button>`).join('')}</div>
    ${H.where!=='online'?`<div class="field mt" style="max-width:420px"><label>Město nebo obec</label><input type="text" autocomplete="address-level2" value="${H.city}" onchange="S.help.city=this.value"><span class="hint">V Praze a Brně klidně i městskou část. Podle toho vám přidělíme koordinátora z okolí.</span></div>`:`<p class="small mute mt">Ozve se vám koordinátor/ka online týmu: sociální sítě, telefonování, grafika, IT nebo překlady.</p>`}
    <h3 class="mt2">S čím byste rádi pomohli?</h3>
    <div class="chips">${AREAS.map(a=>`<button class="chip ${H.areas.has(a)?'on':''}" onclick="S.help.areas.has('${a}')?S.help.areas.delete('${a}'):S.help.areas.add('${a}');render()">${a}</button>`).join('')}</div>
    <h3 class="mt2">Kolik máte času?</h3>
    <div class="chips">${['Jednorázově na akci','Pár hodin měsíčně','Pravidelně každý týden','Hlavně před volbami'].map(a=>`<button class="chip ${H.avail===a?'on':''}" onclick="S.help.avail='${a}';render()">${a}</button>`).join('')}</div>
    <h3 class="mt2">Chcete nám něco vzkázat?</h3>
    <div class="field"><textarea style="min-height:90px" placeholder="Co umíte, co vás zajímá, kdy se vám to hodí… (nepovinné)">Mám dodávku, o víkendech můžu pomoct s převozem stánků.</textarea></div>
    <label class="chk"><input type="checkbox" checked><span>Souhlasím, aby mě kvůli dobrovolnictví kontaktoval koordinátor Zelených<small>Text souhlasu určí právní posouzení (otázka č. 23).</small></span></label>
    <button class="btn lg sun mt" onclick="S.help.done=true;render();window.scrollTo(0,0)">Chci pomoct ${ic('arrow','sm')}</button>
  </div><div><div class="card flat" style="background:var(--g50);border-color:#cfe8d8"><h3>${ic('sprout')} Jak to funguje</h3><div class="tl">
    <div class="st done"><b>Vyplníte formulář</b><small>1 minuta, bez registrace</small></div><div class="st"><b>Ozveme se do 7 dní</b><small>Koordinátor/ka z vašeho okolí</small></div><div class="st"><b>Vyberete si akci</b><small>Jen to, co vás baví</small></div><div class="st"><b>Poděkujeme</b><small>A když budete chtít, nabídneme víc</small></div>
  </div></div><p class="small mute mt">Tento formulář se dá vložit i na weby jednotek a kampaní.</p></div></div></div></div>`;
};

V['pub.donate']=()=>{
  const D=S.don;const amt=D.amt;
  const steps=['Částka','Údaje dárce','Platba'];
  let w='';
  if(D.step===1) w=`<div class="seg" style="width:100%;display:flex"><button style="flex:1" class="${D.freq==='once'?'on':''}" onclick="S.don.freq='once';render()">Jednorázově</button><button style="flex:1" class="${D.freq==='month'?'on':''}" onclick="S.don.freq='month';render()">Každý měsíc ${ic('heart','sm')}</button></div>
    <div class="amts mt">${(D.freq==='month'?[150,300,500,1000]:[300,500,1000,3000]).map(a=>`<button class="${amt===a?'on':''}" onclick="S.don.amt=${a};render()">${fmt(a)}</button>`).join('')}</div>
    <div class="field mt"><label>Jiná částka (Kč)</label><input type="number" value="${amt}" oninput="S.don.amt=+this.value||0"></div>
    <p class="small mute">${D.freq==='month'?`${kc(amt)} měsíčně je ${kc(amt*12)} ročně. Pravidelné dary nám dovolí plánovat čtyři roky práce dopředu. Zrušit je můžete kdykoli.`:'Děkujeme. Pravidelný dar nám ale pomůže nejvíc, zvážíte ho?'}</p>
    <button class="btn sun lg" style="width:100%;justify-content:center" onclick="S.don.step=2;render()">Pokračovat · ${kc(amt)}${D.freq==='month'?' / měs.':''}</button>`;
  if(D.step===2) w=`<div class="frow"><div class="field"><label>Jméno</label><input type="text" value="Anna"></div><div class="field"><label>Příjmení</label><input type="text" value="Kovářová"></div></div>
    <div class="field"><label>E-mail</label><input type="email" value="anna.kovarova@priklad.cz"><span class="hint">Pošleme na něj potvrzení o daru pro daňové přiznání.</span></div>
    <div class="frow"><div class="field"><label>Datum narození</label><input type="text" value="3. 8. 1985"></div><div class="field"><label>Obec a PSČ</label><input type="text" value="Brno 602 00"></div></div>
    <div class="note bl" style="margin-bottom:10px">${ic('shield')}<div>Zákon o politických stranách vyžaduje u darů jméno, datum narození a bydliště dárce. Tyto údaje zveřejníme jen ve výroční zprávě, jak ukládá zákon.</div></div>
    <label class="chk"><input type="checkbox"><span>Firma / právnická osoba<small>Doplníme IČO a připravíme darovací smlouvu.</small></span></label>
    <label class="chk"><input type="checkbox" checked><span>Chci dostávat zprávy o tom, co se za dar podařilo</span></label>
    <div class="row mt"><button class="btn line" onclick="S.don.step=1;render()">${ic('back','sm')}</button><button class="btn sun lg sp" style="justify-content:center" onclick="S.don.step=3;render()">K platbě</button></div>`;
  if(D.step===3) w=`<div class="seg" style="width:100%;display:flex"><button style="flex:1" class="${D.method==='card'?'on':''}" onclick="S.don.method='card';render()">${ic('card','sm')} Kartou</button><button style="flex:1" class="${D.method==='qr'?'on':''}" onclick="S.don.method='qr';render()" ${D.freq==='month'?'title="Pravidelný dar převodem = trvalý příkaz"':''}>${ic('qr','sm')} QR převodem</button></div>
    ${D.method==='card'?`<div class="mt"><div class="field"><label>Číslo karty</label><div class="cardfield">4242 4242 4242 4242</div></div><div class="frow"><div class="cardfield">12 / 28</div><div class="cardfield">CVC</div></div><p class="small mute">${ic('lock','sm')} Platbu zpracuje Stripe. Číslo karty k nám nedorazí.</p></div>`:
     `<div class="row mt" style="align-items:flex-start">${qr('don'+amt,130)}<dl class="dl" style="grid-template-columns:90px 1fr"><dt>Částka</dt><dd><b>${kc(amt)}</b></dd><dt>Účet</dt><dd>9876543210/2010 <span class="mute small">(fiktivní)</span></dd><dt>VS</dt><dd><b>7700418</b></dd></dl></div>
     ${D.freq==='month'?'<p class="small mute">U pravidelného daru si nastavte trvalý příkaz s tímto VS. Když platba nedorazí, připomeneme se.</p>':'<p class="small mute">Jakmile platba dorazí na účet, pošleme vám poděkování a potvrzení. Obvykle do 2 dnů.</p>'}`}
    <div class="row mt"><button class="btn line" onclick="S.don.step=2;render()">${ic('back','sm')}</button><button class="btn sun lg sp" style="justify-content:center" onclick="S.don.step=4;render()">${D.method==='card'?'Darovat '+kc(amt):'Hotovo, zaplatím'}</button></div>`;
  if(D.step===4) w=`<div class="big-ok">${ic('check')}</div><h2 style="margin:0 0 6px">Děkujeme, Anno!</h2><p style="margin:0 0 6px">Díky vám může šestičlenný klub Zeleného Brna pracovat čtyři roky naplno.</p><p class="mute">${D.method==='card'?`Dar ${kc(amt)}${D.freq==='month'?' měsíčně':''} je přijatý. Potvrzení jsme poslali e-mailem.`:'Jakmile platba dorazí, pošleme vám poděkování.'}</p>
    <div class="todo"><span class="ic">${ic('hand')}</span><div class="tx"><b>Chcete pomoct i jinak?</b><small>Stačí 2 hodiny na akci</small></div><button class="btn sm ghost" onclick="go('pub','help')">Ano</button></div>
    <div class="todo"><span class="ic g">${ic('link')}</span><div class="tx"><b>Sdílejte sbírku</b><small>Přátelé jsou nejlepší dárci</small></div><button class="btn sm ghost" onclick="toast('Odkaz zkopírován (s UTM: utm_source=share)')">Kopírovat</button></div>
    <button class="btn line mt" onclick="S.don.step=1;render()">${ic('refresh','sm')} Projít flow znovu</button>`;
  return `<div class="pubhero"><div class="pw"><div class="eyebrow">Zelené Brno</div><h1>Podpořte Zelené Brno i po volbách</h1><p>Kampaň skončila a čtyři roky práce začínají. Dvakrát větší klub potřebuje zázemí a pravidelné dary nám dovolí plánovat dopředu.</p></div></div>
  <div class="pw pubbody"><div class="g21" style="align-items:start">
    <div class="pubcard">
      <p class="dstory">V říjnových volbách dostalo <b>Zelené Brno</b> téměř 9 procent hlasů. Počet našich zastupitelek a zastupitelů se zdvojnásobil ze tří na šest a jsme čtvrtou nejsilnější silou ve městě. Na Brně-střed máme historických 17,49 % a devět mandátů. Kampaň jsme přitom poskládali z darů od lidí, jako jste vy: kteří chtějí město, kde bydlení nestojí půl výplaty, ulice jsou bezpečné a stromy v létě dávají stín.</p>
      <div class="dask">${ic('heart','lg')}<div><b>Máme na vás jednu prosbu</b><p>Pokud si to můžete dovolit, nastavte si prosím trvalý dar. Už třeba <b>300 Kč měsíčně</b> udělá velký rozdíl.</p></div></div>
      <h3 class="mt2">Cíl: 150 pravidelných dárců do konce roku</h3>
      <div class="row"><div class="sp"><span style="font-size:26px;font-weight:800;letter-spacing:-.02em">97</span> <span class="mute">pravidelných dárců · ${kc(31400)} měsíčně</span></div><span class="pill p-w">zbývá 53</span></div>
      <div class="prog y mt" style="height:12px"><i style="width:65%"></i></div>
      <h3 class="mt2">Nedávno se přidali</h3>
      <div class="chips">${['Anna K. · 300 Kč/měs.','Tomáš V. · 500 Kč/měs.','Jitka a Petr · 1 000 Kč/měs.','Martin S. · 2 000 Kč'].map(x=>`<span class="tag" style="font-size:12.5px;padding:4px 10px">${ic('heart','sm')} ${x}</span>`).join('')}</div>
    </div>
    <div class="pubcard" style="position:sticky;top:70px">${D.step<4?stepper(steps,D.step):''}${w}</div>
  </div></div>`;
};

function appStatus(a){
  if(a.done==='rejected')return['p-n','nepřijat/a'];
  if(a.done)return['p-ok',a.type==='člen'?'přijat/a':'schváleno'];
  if(a.obj)return['p-b','námitka – rozhoduje RKO'];
  if(a.type==='příznivec')return['p-bl','čeká na schválení'];
  if(a.day>=32&&!a.paid)return['p-b','po termínu – nezaplaceno'];
  if(!a.paid&&a.day>=22)return['p-w','upomínka odeslána'];
  if(!a.paid)return['p-w','čeká na platbu'];
  return['p-ok','zaplaceno – lhůta běží'];
}

const REC=(()=>{const r=rng('rec');const out=[];const amts=[100,100,150,200,200,200,300,300,300,300,500,500,500,1000,1000,2000];
  const mk=(rec,ko)=>{const {name}=mkName(r);const a=pick(r,amts);const months=ri(r,1,62);const x=r();
    const st=x<.05?'ended':x<.09?'failed':x<.15?'expiring':'active';
    return{name,rec,ko,amt:a,months,st,ch:r()>.76?'trvalý příkaz':'karta',next:ri(r,15,30)-14,endDays:ri(r,2,29),
      email:deb(name).replace(' ','.')+ri(r,1,99)+'@priklad.cz',total:a*months,src:pick(r,['darovací stránka','telefonování','newsletter','stánek','přihláška člena'])}};
  ALL_ZO.forEach(z=>{const n=Math.round(z.m*.16+r()*1.4);for(let i=0;i<n;i++)out.push(mk('ZO '+z.zo,z.ko))});
  KO.forEach(k=>{const n=Math.round(k.m*.05)+1;for(let i=0;i<n;i++)out.push(mk('KO '+k.n,k.n))});
  for(let i=0;i<46;i++){const d=mk('Strana (celostátně)',null);if(i<10){d.ch='Lunda';d.st='active'}out.push(d)}
  return out})();
const REC_ST={active:['p-ok','aktivní'],expiring:['p-w','karta expiruje'],failed:['p-b','platba selhala'],ended:['p-n','ukončeno']};
const mil=n=>(n/1e6).toFixed(2).replace('.',',')+' mil. Kč';
const tis=n=>Math.round(n/1000)+' tis.';

/* ---------- model a prognóza ---------- */
function FD(sc=S.fscope){
  const k=KO.find(k=>k.n===sc);const share=k?k.m/TOTAL:1;const r=rng('f'+sc);
  const recs=REC.filter(d=>!k||d.ko===k.n);
  const live=recs.filter(d=>d.st!=='ended');
  const mrr=live.reduce((a,d)=>a+d.amt,0);
  const ended=recs.filter(d=>d.st==='ended'), failed=recs.filter(d=>d.st==='failed'), expiring=recs.filter(d=>d.st==='expiring');
  const months=['led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'];
  const series=months.map((m,i)=>({m,rec:Math.round(mrr*(.8+i*.018)),one:Math.round((52000+r()*60000+(i===8?115000:0)+(i===11?85000:0))*share)}));
  const nov=series[10],dec=series[11];
  // listopad: 14 dní ze 30
  const novRecDone=Math.round(nov.rec*.56), novOneDone=Math.round(nov.one*14/30);
  const pledges={n:Math.max(1,Math.round(9*share)),sum:Math.round(18500*share/100)*100};
  const avgOne=Math.round((series[7].one+series[8].one+series[9].one)/3);
  const novF={done:novRecDone+novOneDone,
    recLeft:nov.rec-novRecDone-failed.reduce((a,d)=>a+d.amt,0),
    oneLeft:Math.round(avgOne*16/30),
    pledge:Math.round(pledges.sum*.6)};
  novF.total=novF.done+novF.recLeft+novF.oneLeft+novF.pledge;
  const decF={rec:dec.rec,one:dec.one,total:dec.rec+dec.one};
  const janOct=series.slice(0,10).reduce((a,s)=>a+s.rec+s.one,0);
  const ytd=janOct+novF.done;
  const year=janOct+novF.total+decF.total;
  const rest=year-ytd;
  const churn12=ended.reduce((a,d)=>a+d.amt,0)*12;
  const next={rec:Math.round(mrr*12*.88),one:Math.round(series.reduce((a,s)=>a+s.one,0)*.95)};
  next.total=next.rec+next.one;
  const newD={n:Math.max(1,Math.round(23*share)),sum:Math.round(14800*share/100)*100};
  return{k,share,r,label:k?'KO '+k.n:'Celá strana',recs,live,mrr,ended,failed,expiring,series,novRecDone,novOneDone,novF,decF,janOct,ytd,year,
    low:Math.round(year-rest*.22),high:Math.round(year+rest*.15),avgOne,pledges,next,newD,churn12,
    avgRec:live.length?Math.round(mrr/live.length):0}
}

function hkStage(a){
  if(a.done==='rejected')return['p-n','zamítnuto','x'];
  if(a.done)return['p-ok','přijat/a','ok'];
  if(a.obj)return['p-b','námitka – rozhoduje RKO','obj'];
  if(a.type==='příznivec')return['p-bl','příznivec – čeká na schválení','new'];
  if(a.day>=32&&!a.paid)return['p-b','po termínu – nezaplaceno','late'];
  if(a.paid&&a.day>=29)return['p-ok','přijetí do '+(32-a.day)+' dnů','soon'];
  if(!a.paid)return['p-w',a.day>=22?'upomínka odeslána':'čeká na platbu','pay'];
  return['p-ok','zaplaceno – lhůta běží','run'];
}

  const key=S.unitSel;const u=unitInfo(key);const r=rng('org'+key);

  const perms={předseda:'Lidé, přihlášky, rozesílka, rozesílače (správce)',místopředseda:'Lidé, přihlášky (čtení)',pokladník:'Dary a příspěvky jednotky, bez osobních detailů',koordinátor:'Dobrovolníci a zapojení',fundraiser:'Darovací stránky, odkazy, dárci jednotky',tajemník:'Lidé celé KO, přihlášky, rozesílka, rozesílače',krk:'Čtení v rozsahu působnosti'};
  return `${ph('Jednotky a orgány','Reálná struktura: 14 KO, '+ALL_ZO.length+' ZO. Oprávnění se odvozují z funkcí, nikdo je nepřiděluje ručně.')}
  <div class="split" style="grid-template-columns:330px 1fr"><div class="card" style="padding:10px 12px;max-height:75vh;overflow:auto"><div class="tree">
   ${KO.map(k=>{const open=S.koOpen.has(k.n);return `<div class="ko"><div class="kh ${S.unitSel==='ko|'+k.n?'on':''}" onclick="S.unitSel='ko|${k.n}';S.koOpen.has('${k.n}')?S.koOpen.delete('${k.n}'):S.koOpen.add('${k.n}');render()"><span style="transform:rotate(${open?90:0}deg);display:inline-flex;transition:.15s">${ic('arrow','sm')}</span>KO ${k.n}<span class="cnt">${k.m}</span></div>
     ${open?k.z.map(z=>`<div class="zo ${S.unitSel==='zo|'+z[0]?'on':''}" onclick="S.unitSel='zo|${z[0]}';render()">${z[1]<=3?`<span class="dot w" title="malá ZO"></span>`:'<span class="dot"></span>'}${z[0]}<span class="cnt">${z[1]}</span></div>`).join(''):''}</div>`}).join('')}
   </div><div class="small mute" style="padding:10px 6px"><span class="dot"></span> ZO &nbsp;<span class="dot w"></span> malá ZO (≤ 3 členové)</div></div>
  <div class="stack"><div class="card"><div class="row"><div class="sp"><div class="small mute">${u.type==='zo'?'Základní organizace · KO '+u.ko:'Krajská organizace'}</div><h2 style="margin:2px 0 0">${u.name}</h2></div><button class="btn sm ghost" onclick="S.unit='${key}';go('unit','home')">${ic('eye','sm')} Pohled jednotky</button><button class="btn sm line" onclick="toast('Otevřena úprava jednotky')">${ic('edit','sm')} Upravit</button></div>
    <div class="kpis mt" style="grid-template-columns:repeat(3,1fr);margin-bottom:0"><div class="kpi"><div class="l">Členové</div><div class="v">${u.members}</div></div><div class="kpi"><div class="l">${u.type==='ko'?'ZO':'Příznivci'}</div><div class="v">${u.type==='ko'?u.zos.length:Math.round(u.members*1.7)}</div></div><div class="kpi"><div class="l">Dobrovolníci</div><div class="v">${Math.round(u.members*.6)}</div></div></div>
    ${u.type==='zo'&&u.members<=3?`<div class="note w mt">${ic('alert')}<div>Malá ZO: dashboardy skryjí souhrny, které by prozradily jednotlivce.</div></div>`:''}</div>
   <div class="card"><h3>${ic('users')} Orgány a funkce</h3><table class="t"><thead><tr><th>Funkce</th><th>Osoba</th><th>Od</th><th>Oprávnění v intranetu</th></tr></thead><tbody>
    ${org.map(([f,k],i)=>{const p=mkName(r);return `<tr><td><b style="font-size:13px">${f}</b></td><td>${u.members===0&&u.type==='zo'?'<span class="mute">neobsazeno</span>':p.name}</td><td class="small mute">${ri(r,2021,2026)}</td><td class="small">${perms[k]}</td></tr>`}).join('')}</tbody></table>
    <p class="small mute">Když funkce skončí, přístup automaticky zanikne. Notifikace chodí na roli (např. ${slug(u.zos[0]).split(' ')[0]}-rzo@zeleni.cz), ne na osobu.</p>
    <button class="btn sm ghost" onclick="toast('Otevřen zápis změny ve funkci (s datem a usnesením)')">${ic('plus','sm')} Zapsat změnu ve funkci</button></div>
   <div class="card"><h3>${ic('mail')} Vazba na konference (Mailman)</h3><table class="t"><thead><tr><th>Jednotka / funkce</th><th>Konference</th><th>Pravidlo</th></tr></thead><tbody>
    ${u.zos.slice(0,4).map(z=>{const s=slug(z);const bad=s.includes('/');return `<tr><td>ZO ${z}</td><td>${bad?`<span class="pill p-w">${s}</span>`:`<b style="font-size:13px">${s}.oznameni</b>`}</td><td class="small">${bad?'nesedí název, nutná převodní tabulka':'členové ZO → oznámení + debata'}</td></tr>`}).join('')}
    <tr><td>Pokladníci</td><td><b style="font-size:13px">kraje.pokladnici</b></td><td class="small">funkce pokladník KO</td></tr></tbody></table></div></div></div>`;
};

V['hk.mailings']=()=>{const L=MAILINGS.filter(m=>!m.done);const m=L[S.mailingsSel]||L[0];
  return `${ph('Rozesílky ke schválení','Jednotky píšou zprávy v intranetu, odchází přes Action Network až po schválení.')}
  ${!m?`<div class="card" style="text-align:center;padding:40px"><div class="big-ok" style="margin:0 auto 14px">${ic('check')}</div><h2>Nic nečeká</h2></div>`:
  `<div class="split"><div>${L.map((x,i)=>`<button class="li ${x===m?'on':''}" onclick="S.mailingsSel=${i};render()"><div class="top"><b>${x.unit}</b><small>${x.when}</small></div><div style="font-size:13px">${x.subj}</div><small>${fmt(x.n)} příjemců · ${x.by}</small></button>`).join('')}</div>
  <div class="card"><div class="row"><div class="sp"><div class="small mute">${m.unit} · připravil/a ${m.by}</div><h2 style="margin:2px 0 0;font-size:20px">${m.subj}</h2></div><span class="pill p-w">čeká na schválení</span></div>
   <div class="mailprev mt"><div class="mhd">Od: ${m.unit} · Komu: štítek jednotky v Action Networku (${fmt(m.n)} lidí)</div><div class="mbd"><div class="banner">${m.unit}</div>Dobrý den {{jméno}},<br><br>zveme vás na… <span class="mute">[text rozesílky]</span><p class="small mute" style="margin-top:20px">Patička s odhlášením · odesláno přes Action Network</p></div></div>
   <div class="g2 mt"><dl class="dl" style="grid-template-columns:100px 1fr"><dt>Cílení</dt><dd>členové, příznivci, kontakty ve spádu</dd><dt>Odeslání</dt><dd>hned po schválení</dd></dl><div class="note bl">${ic('shield')}<div>Kontrola: cílí jen na lidi jednotky ✓ · patička ✓ · bez příloh ✓</div></div></div>
   <div class="field mt"><label>Komentář pro jednotku (při vrácení)</label><input type="text" placeholder="např. doplňte datum akce"></div>
   <div class="row"><span class="sp"></span><button class="btn line" onclick="m_done(${MAILINGS.indexOf(m)},'Vráceno jednotce k úpravě s komentářem')">Vrátit k úpravě</button><button class="btn" onclick="m_done(${MAILINGS.indexOf(m)},'Schváleno. Rozesílka se zakládá v Action Networku a odejde do 5 minut.')">${ic('check','sm')} Schválit a odeslat</button></div></div></div>`}`};
function m_done(i,msg){MAILINGS[i].done=true;S.mailingsSel=0;render();toast(msg)}

V['hk.integr']=()=>{const R=S.integrRetry;
  const cards=[['Fio API – účet příspěvků','ok','Dnes 06:00 · 61 pohybů','denně'],['Fio API – účet darů','ok','Dnes 06:00 · 88 pohybů','denně'],['Stripe webhooky','ok','Před 4 min · 0 chyb za 30 dní','průběžně'],['Lunda (dary ze Stripe)','ok','Dnes 06:05 · 2 dary','denně'],['Action Network','ok','Fronta 0 · 1 204 zápisů za týden','průběžně'],['YunoHost (účty SSO)','w','3 účty čekají, skript na YunoHostu si je stáhne v 12:00','každé 2 h'],['Discourse','ok','Včera · 1 zákaz bývalého člena','při změně'],['Mailman list.zeleni.cz',R?'ok':'b',R?'Právě teď · 12 změn provedeno':'Chyba 05:40: timeout tunelu · 12 změn ve frontě','každou hodinu']];
  return `${ph('Integrace','Výpadek služby nezastaví intranet. Změny se řadí do fronty a provedou se po obnovení.')}
  <div class="g3">${cards.map(([n,s,d,f])=>`<div class="card"><div class="row"><span class="dot ${s==='ok'?'':s}"></span><b class="sp">${n}</b><span class="small mute">${f}</span></div><p class="small" style="margin:8px 0 0;color:${s==='b'?'var(--warn)':'var(--ink2)'}">${d}</p>
   ${s==='b'?`<div class="row mt"><button class="btn sm" onclick="S.integrRetry=true;render();toast('Spojení obnoveno, 12 změn provedeno')">${ic('refresh','sm')} Zkusit znovu</button><button class="btn sm line" onclick="toast('Zobrazena fronta změn')">Fronta (12)</button></div>`:''}</div>`).join('')}</div>
  <div class="card mt"><h3>${ic('list')} Poslední úlohy</h3><table class="t"><thead><tr><th>Čas</th><th>Služba</th><th>Akce</th><th>Výsledek</th></tr></thead><tbody>
   ${[['11:52','Action Network','zápis 3 nových dárců se štítky','ok'],['11:30','Stripe','webhook checkout.session.completed','ok'],['10:00','YunoHost','fronta: založit 3 účty (noví členové)','w'],['06:05','Lunda/Stripe','import 2 darů','ok'],['06:00','Fio','stažení pohybů, 142 spárováno, 7 do fronty','ok'],['05:40','Mailman','synchronizace členství: timeout',R?'ok':'b'],['včera 23:00','Zálohy','šifrovaná záloha mimo server (2,1 GB)','ok']].map(([t,s,a,r])=>`<tr><td class="small">${t}</td><td><b style="font-size:13px">${s}</b></td><td class="small">${a}</td><td><span class="pill ${r==='ok'?'p-ok':r==='w'?'p-w':'p-b'}">${r==='ok'?'OK':r==='w'?'čeká':'chyba'}</span></td></tr>`).join('')}</tbody></table></div>`};

V['hk.audit']=()=>{
  const r=rng('audit');const acts=[['zobrazení','karta osoby',1],['úprava','e-mail osoby',1],['export','seznam členů',0],['rozesílka','rozesílka jednotky',0],['párování','platba Fio',1],['změna funkce','RZO',1],['přihlášení','SSO',1]];
  const units=['ZO Praha 7','KO Praha','ZO Brno-střed a severovýchod','HK','ZO Liberec','KO Jihomoravský','ZO Olomouc'];
  const rows=Array.from({length:22},(_,i)=>{const a=pick(r,acts);const u=pick(r,units);const n=mkName(r).name;return{t:`${dshort(Math.floor(i/6))} ${String(ri(r,7,22)).padStart(2,'0')}:${String(ri(r,0,59)).padStart(2,'0')}`,n,u,a:a[0],o:a[1],c:a[0]==='export'?ri(r,20,120):a[0]==='rozesílka'?ri(r,100,800):1}});
  const L=rows.filter(x=>S.auditF==='all'||x.a===S.auditF);
  return `${ph('Auditní log','Kdo, kdy, co zobrazil, změnil nebo exportoval',`<button class="btn line" onclick="toast('Log exportován pro KRK')">${ic('download','sm')} Export pro kontrolní komisi</button>`)}
  <div class="card"><div class="row" style="margin-bottom:12px"><div class="seg">${[['all','Vše'],['export','Exporty'],['rozesílka','Rozesílky'],['úprava','Úpravy'],['zobrazení','Zobrazení']].map(([k,l])=>`<button class="${S.auditF===k?'on':''}" onclick="S.auditF='${k}';render()">${l}</button>`).join('')}</div><span class="sp"></span><label class="search">${ic('search','sm')}<input placeholder="Osoba, jednotka…"></label></div>
  <div class="note w" style="margin-bottom:10px">${ic('alert')}<div><b>Neobvyklá aktivita:</b> 3 exporty z ZO Praha 7 během jednoho dne (celkem 186 záznamů). <a>Prověřit</a></div></div>
  <div class="tblwrap"><table class="t"><thead><tr><th>Čas</th><th>Kdo</th><th>Jednotka</th><th>Akce</th><th>Objekt</th><th class="num">Záznamů</th></tr></thead><tbody>
  ${L.map(x=>`<tr><td class="small">${x.t}</td><td>${x.n}</td><td class="small">${x.u}</td><td><span class="pill ${x.a==='export'?'p-w':x.a==='rozesílka'?'p-bl':'p-n'}">${x.a}</span></td><td class="small">${x.o}${x.a==='export'?' · účel: pozvánky na schůzi':''}</td><td class="num">${x.c}</td></tr>`).join('')}</tbody></table></div></div>`};

/* ---------- init ---------- */
(function(){const h=location.hash.slice(1).split('/');if(ROLES[h[0]]){S.role=h[0];S.screen=ROLES[h[0]].screens.some(s=>s[0]===h[1])?h[1]:ROLES[h[0]].screens[0][0]}render()})();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
</script>
